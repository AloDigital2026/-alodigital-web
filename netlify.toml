# Configuración de Netlify para AlóDigital - Página de presentación
#
# NOTA IMPORTANTE PARA DIEGO: revise en su panel de Netlify (Site settings →
# Build & deploy → Build settings) cuál "build command" y "publish directory"
# está usando actualmente el sitio. Si Netlify ya tiene algo configurado ahí
# manualmente, lo de abajo en [build] debe coincidir exactamente con eso —
# normalmente en un proyecto Vite es "npm run build" y la carpeta "dist".
# Si no está seguro, no cambie esta parte y solo agregue el bloque [functions]
# a lo que ya tenga.

[build]
  command = "npm run build"
  publish = "dist"

[functions]
  directory = "netlify/functions"
  external_node_modules = ["@google/genai"]
